# Redireciona HTTP → HTTPS e serve o desafio do Certbot
server {
    listen 80;
    server_name SEU_DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy para o NinoAgent
server {
    listen 443 ssl;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;

    # Segurança TLS mínima
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Limite de upload para envio de mídia pelo monitor
    client_max_body_size 20M;

    location / {
        proxy_pass         http://nino-app:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Timeout maior para o agente (CrewAI pode levar ~60s)
        proxy_read_timeout 120s;
    }
}
