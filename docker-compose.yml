services:
  postgres:
    container_name: nino-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ninoagent
      POSTGRES_USER: ninoagent
      POSTGRES_PASSWORD: ninoagent
    volumes:
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
      - nino-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninoagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    container_name: nino-qdrant
    image: qdrant/qdrant:v1.13.3
    volumes:
      - nino-qdrant-data:/qdrant/storage
    restart: unless-stopped

  redis:
    container_name: nino-redis
    image: redis:7-alpine
    restart: unless-stopped

  ninoagent:
    container_name: nino-app
    build: .
    env_file: .env
    environment:
      # Sobrescreve localhost → nomes dos serviços Docker
      POSTGRES_HOST: nino-postgres
      REDIS_URL: redis://nino-redis:6379
      QDRANT_URL: http://nino-qdrant:6333
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped

  nginx:
    container_name: nino-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ninoagent.conf:/etc/nginx/conf.d/default.conf:ro
      - nino-certbot-www:/var/www/certbot:ro
      - nino-certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - ninoagent
    restart: unless-stopped

  certbot:
    container_name: nino-certbot
    image: certbot/certbot
    volumes:
      - nino-certbot-www:/var/www/certbot
      - nino-certbot-certs:/etc/letsencrypt
    # Roda manualmente: docker compose run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  nino-postgres-data:
  nino-qdrant-data:
  nino-certbot-www:
  nino-certbot-certs:
